<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGEPI · Controle de EPIs</title>
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#1b2333; --muted:#667085; --line:#e3e7ee;
  --side:#18202f; --side2:#222c3f; --pri:#2457c5; --pri2:#1c48a6; --amber:#f2a900;
  --ok:#1f9d55; --warn:#d98a00; --bad:#d64545; --purple:#7a4fd1;
  --r:12px; --sh:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
a.btn{text-decoration:none}
td:first-child{white-space:nowrap}
.layout{display:flex;min-height:100vh}
.side{width:232px;background:var(--side);color:#cfd6e4;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid #2b3549}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--amber);display:grid;place-items:center;color:#18202f;font-weight:800}
.brand b{color:#fff;font-size:16px;letter-spacing:.3px}
.brand small{display:block;color:#8d98ad;font-size:11px}
.nav{padding:12px 10px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#cfd6e4;text-decoration:none;margin-bottom:2px}
.nav a:hover{background:var(--side2)}
.nav a.on{background:var(--pri);color:#fff}
.nav .ico{width:18px;text-align:center;opacity:.9}
.nav .cnt{margin-left:auto;background:var(--amber);color:#18202f;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}
.me{padding:14px 18px;border-top:1px solid #2b3549;font-size:12px}
.me b{color:#fff;display:block;font-size:13px}
.me button{margin-top:8px;background:none;border:1px solid #3a465e;color:#cfd6e4;border-radius:6px;padding:4px 10px;cursor:pointer}
.main{flex:1;min-width:0;padding:26px 30px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;font-weight:700}
.top .sp{flex:1}
.demo-tag{background:#fff4d6;color:#8a5a00;border:1px solid #f5d98b;border-radius:20px;padding:3px 10px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h2{font-size:15px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:16px 18px;cursor:pointer;transition:transform .1s}
.kpi:hover{transform:translateY(-1px)}
.kpi .n{font-size:28px;font-weight:700;margin-top:4px}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi.k-amber{border-top:3px solid var(--amber)} .kpi.k-blue{border-top:3px solid var(--pri)}
.kpi.k-purple{border-top:3px solid var(--purple)} .kpi.k-red{border-top:3px solid var(--bad)} .kpi.k-green{border-top:3px solid var(--ok)}
.two{grid-template-columns:1.4fr 1fr}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:#f7f9fc}
td.num,th.num{text-align:right}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.s-ag{background:#fff3d6;color:#8a5a00}.s-ap{background:#e3ecff;color:#1c48a6}.s-pr{background:#efe7ff;color:#5a34a8}
.s-re{background:#dcf5e6;color:#14713d}.s-rc{background:#fde4e4;color:#a32b2b}.s-ca{background:#eceff3;color:#555}
.s-low{background:#fde4e4;color:#a32b2b}.s-okk{background:#dcf5e6;color:#14713d}.s-mid{background:#fff3d6;color:#8a5a00}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:#f6f8fb}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#f2c4c4}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:wait}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:150px;flex:1}
.fld label{font-size:12px;color:var(--muted);font-weight:600}
input,select,textarea{border:1px solid #d3d9e3;border-radius:8px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd0ff;border-color:var(--pri)}
input.qty{width:90px;text-align:right}
textarea{min-height:70px;resize:vertical}
.muted{color:var(--muted)} .small{font-size:12px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;cursor:pointer;font-size:12.5px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 20px}
.dl div span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.dl div b{font-weight:600}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:6px}
.timeline li:last-child{border-color:transparent}
.timeline li:before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--pri);border:2px solid #fff}
.progress{height:6px;background:#edf0f5;border-radius:4px;overflow:hidden;min-width:70px}
.progress i{display:block;height:100%;background:var(--ok)}
.steps{display:flex;gap:0;margin:4px 0 6px}
.steps div{flex:1;text-align:center;font-size:11.5px;color:var(--muted);position:relative;padding-top:18px}
.steps div:before{content:"";position:absolute;top:5px;left:0;right:0;height:3px;background:#e3e7ee}
.steps div:after{content:"";position:absolute;top:0;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:#e3e7ee}
.steps div.done:before,.steps div.done:after{background:var(--ok)}
.steps div.done{color:var(--ink);font-weight:600}
.toast-box{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:#1b2333;color:#fff;padding:11px 16px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:380px;animation:in .2s}
.toast.ok{background:#14713d}.toast.err{background:#a32b2b}.toast.warn{background:#8a5a00}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:grid;place-items:center;z-index:50;padding:16px}

.modal h3{margin:0 0 16px}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#18202f,#2457c5)}
.login .box{background:#fff;border-radius:16px;padding:32px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login .logo{width:48px;height:48px;border-radius:12px;background:var(--amber);display:grid;place-items:center;font-weight:800;font-size:20px;margin-bottom:14px}
.login h1{margin:0 0 4px;font-size:22px}
.profile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;cursor:pointer;margin-top:10px}
.profile:hover{border-color:var(--pri);background:#f6f9ff}
.av{width:36px;height:36px;border-radius:50%;background:#e3ecff;color:var(--pri);display:grid;place-items:center;font-weight:700}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.menu-btn{display:none}
@media(max-width:820px){
  .side{position:fixed;left:-240px;z-index:40;transition:left .2s}
  .side.open{left:0}
  .menu-btn{display:inline-flex}
  .main{padding:18px 14px 60px}
  .hide-m{display:none}
}
.scroll{overflow-x:auto}
.alert{background:#fff7e6;border:1px solid #f5d98b;color:#7a5200;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.alert.err{background:#fdecec;border-color:#f2c4c4;color:#8f2424}
code{background:#f1f3f7;border-radius:4px;padding:1px 5px;font-size:12.5px}
</style>

<body>
<div id="app"><div class="loading">Carregando…</div></div>
<div class="toast-box" id="toasts"></div>

<script>
/* =====================================================================
   SIGEPI — Controle de EPIs (pedido → aprovação → recebimento)
   ---------------------------------------------------------------------
   CONFIGURAÇÃO: com supabaseUrl vazio o app roda em MODO DEMONSTRAÇÃO
   (dados de exemplo salvos só neste navegador). Para usar com a equipe,
   cole aqui a "Project URL" e a chave pública (publishable/anon) do Supabase
   (Project Settings → API). A chave anon PODE ficar no código: quem
   protege os dados são as regras criadas pelo arquivo supabase.sql.
   ===================================================================== */
const CONFIG = {
  supabaseUrl: 'https://pthtodauvlzfvduwrwdo.supabase.co',
  supabaseAnonKey: 'sb_publishable_4OSLipvGSDR3jR96dKQA9A_lYCj6cmG',   // chave pública (publishable)
  diasHistorico: 180,    // janela (em dias) usada para calcular a saída média por dia
};

const ST = { AG:'Aguardando aprovação', AP:'Aprovado', PR:'Parcialmente recebido', RE:'Recebido', RC:'Recusado', CA:'Cancelado' };
const ST_CLASS = { [ST.AG]:'s-ag', [ST.AP]:'s-ap', [ST.PR]:'s-pr', [ST.RE]:'s-re', [ST.RC]:'s-rc', [ST.CA]:'s-ca' };
const ABERTOS = [ST.AG, ST.AP, ST.PR];
const DEMO = !CONFIG.supabaseUrl;

/* ============================ utilidades ============================ */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const hoje = () => new Date().toISOString().slice(0,10);
const agora = () => new Date().toISOString();
const fmtData = s => { if(!s) return '—'; const d = String(s).slice(0,10).split('-'); return d.length===3 ? `${d[2]}/${d[1]}/${d[0]}` : esc(s); };
const fmtDataHora = s => { if(!s) return '—'; const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}); };
const fmtMes = s => { if(!s) return '—'; const [a,m] = String(s).split('-'); return m ? `${m}/${a}` : esc(s); };
const pad = (n, w=4) => String(n).padStart(w, '0');
const iniciais = n => String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();
const pill = s => `<span class="pill ${ST_CLASS[s]||'s-ca'}">${esc(s)}</span>`;
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();

function toast(msg, tipo='ok', ms=4200){
  const el = document.createElement('div');
  el.className = 'toast ' + tipo; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), ms);
}
function modal(html){ closeModal(); const bg = document.createElement('div'); bg.className='modal-bg'; bg.id='modal';
  bg.innerHTML = `<div class="modal">${html}</div>`; bg.addEventListener('mousedown', e => { if(e.target===bg) closeModal(); });
  document.body.appendChild(bg); const f = bg.querySelector('input,select,textarea'); if(f) f.focus(); }
function closeModal(){ const m = $('#modal'); if(m) m.remove(); }
/** Confirmação dentro da página (alert/confirm do navegador são bloqueados em alguns lugares) */
function confirmar(msg, ok='Confirmar', perigo=false){
  return new Promise(res => {
    modal(`<h3>Confirmar</h3><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn" id="cfNao">Voltar</button><button class="btn ${perigo ? 'bad' : 'pri'}" id="cfSim">${esc(ok)}</button></div>`);
    $('#cfNao').onclick = () => { closeModal(); res(false); };
    $('#cfSim').onclick = () => { closeModal(); res(true); };
  });
}

/** Executa uma gravação com botão travado; só mostra sucesso se TUDO deu certo. */
async function salvar(btn, fn, msgOk){
  if(btn){ btn.disabled = true; btn.dataset.txt = btn.textContent; btn.textContent = 'Salvando…'; }
  try { await fn(); if(msgOk) toast(msgOk, 'ok'); return true; }
  catch(e){ console.error(e); toast('Não foi possível salvar: ' + (e.message || e), 'err', 8000); return false; }
  finally { if(btn && document.body.contains(btn)){ btn.disabled = false; btn.textContent = btn.dataset.txt; } }
}

/* ======================= camada de dados: DEMO ====================== */
const DemoStore = {
  key: 'sigepi-demo-v2',
  db: null,
  load(){
    try { this.db = JSON.parse(localStorage.getItem(this.key)); } catch(e){ this.db = null; }
    if(!this.db) this.db = seed();
    if(!this.db.__ok){ this.db = seed(); }
  },
  persist(){ try { localStorage.setItem(this.key, JSON.stringify(this.db)); } catch(e){} },
  async init(){ this.load(); },
  async all(lista){ return structuredClone(this.db[lista] || []); },
  async add(lista, campos){ const id = (this.db.seq[lista] = (this.db.seq[lista]||0) + 1);
    const item = { id, ...campos }; (this.db[lista] ||= []).push(item); this.persist(); return structuredClone(item); },
  async update(lista, id, campos){ const it = this.db[lista].find(x => x.id === id); if(!it) throw new Error('Item não encontrado');
    Object.assign(it, campos); this.persist(); return structuredClone(it); },
  async remove(lista, id){ this.db[lista] = this.db[lista].filter(x => x.id !== id); this.persist(); },
  reset(){ this.db = seed(); this.persist(); },
};

/* ==================== camada de dados: SUPABASE ===================== */
let sb = null, sessao = null;
function carregarScript(src){ return new Promise((ok, erro) => { const s = document.createElement('script'); s.src = src; s.onload = ok;
  s.onerror = () => erro(new Error('Não consegui carregar ' + src + ' (internet bloqueada?)')); document.head.appendChild(s); }); }
function erroAmigavel(e){
  const m = e?.message || String(e);
  if(/row-level security|permission denied|0 rows|no\) rows/i.test(m)) return 'Sem permissão. Seu e-mail precisa estar cadastrado em Usuários.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.';
  if(/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m)) return 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada e o spam).';
  if(/already registered/i.test(m)) return 'Esse e-mail já tem conta. Use "Entrar".';
  if(/Password should be/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/duplicate key/i.test(m)) return 'Já existe um registro igual (código ou e-mail repetido).';
  return m;
}
const chk = ({ data, error }) => { if(error) throw new Error(erroAmigavel(error)); return data; };
const SupaStore = {
  async init(){
    await carregarScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
    sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
    sessao = chk(await sb.auth.getSession()).session;
  },
  async all(t){ const out = [];
    for(let de = 0; ; de += 1000){ const d = chk(await sb.from(t).select('*').order('id').range(de, de + 999)); out.push(...d); if(d.length < 1000) break; }
    return out; },
  async add(t, c){ return chk(await sb.from(t).insert(c).select().single()); },
  async update(t, id, c){ return chk(await sb.from(t).update(c).eq('id', id).select().single()); },
  async remove(t, id){ chk(await sb.from(t).delete().eq('id', id)); },
};
const Store = DEMO ? DemoStore : SupaStore;

/* ============================== estado ============================== */
const S = { user:null, data:{ epis:[], usuarios:[], pedidos:[], itens:[], consumo:[], perguntas:[], config:[], contagens:[] }, rascunho:[], contagem:{}, filtros:{ pedidos:'Abertos', perg:'Pendentes', busca:'' }, erroSetup:null };

const OPCIONAIS = ['config', 'contagens'];
const cfg = chave => S.data.config.find(c => c.Chave === chave)?.Valor || '';
async function setCfg(chave, valor){
  const ex = S.data.config.find(c => c.Chave === chave);
  ex ? await Store.update('config', ex.id, { Valor: valor }) : await Store.add('config', { Chave: chave, Valor: valor });
}
async function recarregar(...listas){
  if(!listas.length) listas = Object.keys(S.data);
  const res = await Promise.all(listas.map(l => Store.all(l).catch(e => {
    if(OPCIONAIS.includes(l)){ S.faltaSQL = true; return []; }   // tabelas novas: o app funciona mesmo sem elas
    throw e; })));
  listas.forEach((l,i) => S.data[l] = res[i]);
}
const area = () => S.user?.area;
const pode = {
  criarPedido: () => ['SHE','Admin'].includes(area()),
  aprovar:     () => ['Compras','Admin'].includes(area()),
  receber:     () => ['SHE','Admin'].includes(area()),
  estoque:     () => ['SHE','Admin'].includes(area()),
  responder:   () => ['Compras','Admin'].includes(area()),
  admin:       () => area() === 'Admin',
};

/* ========================= regras de negócio ======================== */
const epiPorId = id => S.data.epis.find(e => e.id === Number(id));
const itensDo = pid => S.data.itens.filter(i => Number(i.PedidoId) === Number(pid));
const hist = p => { try { return JSON.parse(p.Historico || '[]'); } catch(e){ return []; } };
const comHist = (p, acao) => JSON.stringify([...hist(p), { data: agora(), usuario: S.user.nome, acao }]);

function mesesAtras(n){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - n); return d.toISOString().slice(0,7); }
const DIA = 864e5;
const dataDe = s => { const d = new Date(String(s || '').slice(0,10) + 'T12:00:00'); return isNaN(d) ? null : d; };
const diasEntre = (a, b) => { const x = dataDe(a), y = dataDe(b); return x && y ? Math.round((y - x) / DIA) : null; };
const somaDias = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const diasPeriodo = c => { const d = diasEntre(c.DataInicio, c.DataFim); return d == null || d < 0 ? 0 : d + 1; };

/** Saída média por dia = soma do que saiu ÷ soma dos dias dos períodos lançados (janela recente) */
const mesmoCodigo = e => S.data.epis.filter(x => norm(x.Codigo) === norm(e.Codigo)).length || 1;
/** Lançamentos que valem para o item: os ligados a ele (EpiId) + os só por código (vindos do outro sistema) */
function saidasDoItem(e){
  return S.data.consumo.filter(c => c.EpiId ? Number(c.EpiId) === e.id : norm(c.Codigo) === norm(e.Codigo));
}
function saidaDia(e){
  let regs = saidasDoItem(e);
  const recentes = regs.filter(c => (c.DataFim || '') >= somaDias(-CONFIG.diasHistorico));
  if(recentes.length) regs = recentes;
  const div = mesmoCodigo(e);   // código compartilhado (tamanhos/cores): a saída "só por código" é dividida igualmente
  // várias linhas do mesmo período (uma por saída) = um período só: soma as quantidades, conta os dias UMA vez
  const per = new Map();
  for(const c of regs){ const n = diasPeriodo(c); if(!n) continue;
    const k = c.DataInicio + '|' + c.DataFim, g = per.get(k) || { ini:c.DataInicio, fim:c.DataFim, n, q:0 };
    g.q += num(c.QtdSaida) / (c.EpiId ? 1 : div); per.set(k, g); }
  // períodos que se sobrepõem (ex.: relatório anual + um mês dentro dele): vale o mais longo, para não contar em dobro
  const usados = [];
  for(const g of [...per.values()].sort((a,b) => b.n - a.n)) if(!usados.some(x => g.ini <= x.fim && g.fim >= x.ini)) usados.push(g);
  const q = usados.reduce((t,g) => t + g.q, 0), d = usados.reduce((t,g) => t + g.n, 0);
  return d ? q / d : 0;
}
/** Prazo real = média de dias entre o pedido ao fornecedor e a 1ª entrega do item */
function prazoReal(epiId){
  const ds = [];
  for(const i of S.data.itens.filter(i => Number(i.EpiId) === epiId && i.DataPrimeiroRecebimento)){
    const p = S.data.pedidos.find(p => p.id === Number(i.PedidoId));
    const d = p ? diasEntre(p.DataPedidoFornecedor || p.DataSolicitacao, i.DataPrimeiroRecebimento) : null;
    if(d != null && d >= 0) ds.push(d);
  }
  return ds.length ? { dias: Math.round(ds.reduce((a,b) => a + b, 0) / ds.length), n: ds.length } : null;
}
/** Quantidade já pedida/aprovada que ainda não chegou */
function emAberto(epiId){
  let t = 0;
  for(const p of S.data.pedidos.filter(p => ABERTOS.includes(p.Status)))
    for(const i of itensDo(p.id).filter(i => Number(i.EpiId) === epiId))
      t += Math.max(0, (p.Status === ST.AG ? num(i.QtdPedida) : num(i.QtdAprovada)) - num(i.QtdRecebida));
  return t;
}
/** Todos os indicadores de um EPI */
function calc(e){
  const sd = saidaDia(e), real = prazoReal(e.id), prazo = real ? real.dias : num(e.PrazoEntregaDias);
  const atual = num(e.EstoqueAtual), min = num(e.EstoqueMinimo), aberto = emAberto(e.id);
  const diasAteMin = sd > 0 ? Math.max(0, (atual - min) / sd) : null;   // quantos dias até bater no mínimo
  const diasAteZero = sd > 0 ? atual / sd : null;                        // quantos dias até acabar
  const sug = Math.max(0, Math.ceil(sd * prazo + min - atual - aberto)); // o que pedir para não furar o mínimo
  return { sd, real, prazo, atual, min, aberto, diasAteMin, diasAteZero, sug };
}
const sugestao = e => calc(e).sug;
const numQtd = v => { if(typeof v === 'number') return v; const t = String(v ?? '').trim();
  return /^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t) ? num(t.replace(/\./g, '')) : num(t); };
const fmtDias = d => d == null ? '—' : d >= 999 ? '999+' : Math.floor(d) + ' d';
const fmtTaxa = v => v ? (v >= 10 ? v.toFixed(0) : v >= 1 ? v.toFixed(1).replace('.', ',') : v.toFixed(2).replace('.', ',')) : '—';
const fmtAteMin = c => c.atual <= c.min ? '<span class="pill s-low">no mínimo</span>' : fmtDias(c.diasAteMin);
const fmtPrazo = c => c.real ? c.prazo + ' d' : c.prazo ? c.prazo + ' d*' : '<span class="muted">sem prazo</span>';
function situacaoEstoque(e){
  const c = calc(e);
  if(c.atual <= c.min) return ['Abaixo do mínimo','s-low'];
  if(c.sug > 0) return ['Pedir já','s-mid'];
  return ['OK','s-okk'];
}
function atrasado(p){ return [ST.AP, ST.PR].includes(p.Status) && p.PrevisaoEntrega && p.PrevisaoEntrega < hoje(); }

}

  const pend = S.data.perguntas.filter(q => q.Status === 'Pendente');
  const kpi = (n, l, cls, href) => `<div class="card kpi ${cls}" data-go="${href}"><div class="l">${l}</div><div class="n">${n}</div></div>`;

  const atencao = [];
  if(pode.aprovar()) ag.forEach(p => atencao.push([`${esc(p.Title)} aguardando sua aprovação`, `#/pedido/${p.id}`, ST.AG]));
  atras.forEach(p => atencao.push([`${esc(p.Title)} com entrega atrasada (previsão ${fmtData(p.PrevisaoEntrega)})`, `#/pedido/${p.id}`, 'Atrasado']));
  if(pode.responder()) pend.forEach(q => atencao.push([`Pergunta de ${esc(q.SolicitadoPor)}: “${esc(String(q.Pergunta).slice(0,60))}”`, '#/perguntas', 'Pendente']));

    .forEach(([e,c]) => atencao.push([`${esc(e.Title)}: ${c.atual <= c.min ? 'já no mínimo' : 'chega no mínimo em ' + fmtDias(c.diasAteMin)}, entrega leva ~${c.prazo} d → pedir ${c.sug}`, '#/estoque', 'Pedir já']));

    ${kpi(ap.length,'Aprovados · aguardando entrega','k-blue','#/pedidos?f=' + encodeURIComponent(ST.AP))}
    ${kpi(pr.length,'Parcialmente recebidos','k-purple','#/pedidos?f=' + encodeURIComponent(ST.PR))}

  <div class="grid two" style="margin-top:16px">
    <div class="card"><h2>Pedidos recentes</h2>${tabelaPedidos(recentes)}</div>
    <div class="card"><h2>Precisa de atenção</h2>${atencao.length ? `<table>${atencao.map(([t,h,s]) =>
      `<tr class="click" data-go="${h}"><td>${t}</td><td class="num">${ST_CLASS[s] ? pill(s) : `<span class="pill ${s==='Atrasado'?'s-rc':'s-ag'}">${s}</span>`}</td></tr>`).join('')}</table>`

function telaPedidos(q){

function telaEstoque(){
  const b = norm(S.filtros.busca);
  let lista = [...S.data.epis].sort((a,b) => a.Title.localeCompare(b.Title));
  if(b) lista = lista.filter(e => norm([e.Title, e.Codigo, e.CA, e.Prioridade, situacaoEstoque(e)[0]].join(' ')).includes(b));
  return shell('estoque','Estoque', `<div class="card">

  <div class="scroll"><table><tr><th>Código</th><th>Item</th><th class="num">Atual</th><th class="num hide-m">Mín</th>
    <th class="num hide-m">Saída/dia</th><th class="num hide-m">Até o mín.</th><th class="num hide-m">Prazo</th><th class="num hide-m">A caminho</th><th class="num">Sugestão</th><th>Situação</th></tr>
  ${lista.map(e => { const [t,cl] = situacaoEstoque(e), c = calc(e);
    return `<tr class="click" data-a="verEpi" data-id="${e.id}">
    <td>${esc(e.Codigo)}</td><td><b>${esc(e.Title)}</b><div class="muted small">${e.CA ? 'CA ' + esc(e.CA) : ''}${e.CA && e.Prioridade ? ' · ' : ''}${e.Prioridade ? 'Prioridade ' + esc(e.Prioridade) : ''}</div></td>
    <td class="num"><b>${c.atual}</b></td><td class="num hide-m">${c.min}</td>
    <td class="num hide-m">${fmtTaxa(c.sd)}</td><td class="num hide-m">${fmtAteMin(c)}</td>
    <td class="num hide-m" title="${c.real ? 'Média real de ' + c.real.n + ' entrega(s)' : 'Prazo cadastrado'}">${fmtPrazo(c)}</td>
    <td class="num hide-m">${c.aberto || '—'}</td><td class="num">${c.sug ? `<b>${c.sug}</b>` : '—'}</td><td><span class="pill ${cl}">${t}</span></td></tr>`; }).join('')
    || '<tr><td colspan="10" class="empty">Nenhum EPI encontrado.</td></tr>'}</table></div>

function parseCSV(txt){
  txt = txt.replace(/^﻿/, '');
  const l1 = txt.split(/\r?\n/)[0], sep = (l1.match(/;/g)||[]).length > (l1.match(/,/g)||[]).length ? ';' : ',';
  const rows = []; let row = [], cel = '', q = false;
  for(let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if(q){ if(ch === '"'){ if(txt[i+1] === '"'){ cel += '"'; i++; } else q = false; } else cel += ch; }
    else if(ch === '"') q = true;
    else if(ch === sep){ row.push(cel); cel = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && txt[i+1] === '\n') i++; row.push(cel); rows.push(row); row = []; cel = ''; }
    else cel += ch;
  }
  if(cel || row.length){ row.push(cel); rows.push(row); }
  const [cab, ...rs] = rows.filter(r => r.some(c => c.trim()));
  return (rs || []).map(r => Object.fromEntries(cab.map((c,i) => [c.trim(), (r[i] ?? '').trim()])));
}
async function carregarXLSX(){ if(!window.XLSX) await carregarScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'); }
async function lerTabela(arq){
  if(/\.iqy$/i.test(arq.name)) throw new Error('Esse arquivo (.iqy) é só um atalho do SharePoint, sem os dados. Use "Exportar para CSV", ou abra o .iqy no Excel e salve como .xlsx.');
  if(/\.csv$/i.test(arq.name)) return parseCSV(await arq.text());
  await carregarXLSX();
  const wb = XLSX.read(await arq.arrayBuffer(), { cellDates:true });
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });
}

async function xlsxBase64(linhas, aba){
  await carregarXLSX();
  const ws = XLSX.utils.json_to_sheet(linhas);
  ws['!cols'] = Object.keys(linhas[0] || {}).map(k => ({ wch: Math.max(k.length, ...linhas.map(l => String(l[k] ?? '').length)) + 2 }));

  return XLSX.write(wb, { type:'base64', bookType:'xlsx' });

async function postarFluxo(dados){
  const url = cfg('fluxo_email_url');
  if(!url) throw new Error('A URL do fluxo de e-mail não foi configurada (Configurações).');
  if(DEMO) throw new Error('No modo demonstração o e-mail não é enviado.');
  let r;
  try { r = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(dados) }); }
  catch(e){ throw new Error('Não consegui falar com o fluxo (rede bloqueada ou URL errada).'); }
  if(r.ok) return;
  const t = await r.text().catch(() => '');
  if(r.status === 401 || /DirectApiAuthorizationRequired/.test(t))
    throw new Error('O fluxo exige login (401). No gatilho, deixe "Quem pode disparar o fluxo" = Qualquer pessoa, SALVE o fluxo e copie a URL de novo (ela precisa ter "sig=" no final).');
  if(r.status === 404) throw new Error('Fluxo não encontrado (404). Ele foi apagado ou a URL está errada.');
  throw new Error(`O fluxo respondeu com erro ${r.status}. ${t.slice(0, 200)}`);
}

let linhasImport = [];
async function lerPlanilha(ev){
  const arq = ev.target.files[0]; if(!arq) return;
  $('#prev').innerHTML = '<span class="muted">Lendo…</span>';
  try {
    const linhas = await lerTabela(arq);
    const chave = k => norm(k).replace(/[^a-z]/g,'');
    const achar = (obj, ...nomes) => { for(const k of Object.keys(obj)) if(nomes.includes(chave(k))) return obj[k]; return ''; };
    const de = $('#impDe').value, ate = $('#impAte').value;
    let semData = 0;
    linhasImport = linhas.map(l => {
      let ini = paraData(achar(l,'de','datainicial','datainicio','inicio','periodoinicial','dtinicial'));
      let fim = paraData(achar(l,'ate','datafinal','datafim','fim','periodofinal','dtfinal'));
      if(!ini || !fim){ const m = paraMesAno(achar(l,'mesano','mes','competencia','periodo'));
        if(m){ ini = m + '-01'; const [a, mm] = m.split('-').map(Number); fim = new Date(Date.UTC(a, mm, 0)).toISOString().slice(0,10); } }
      if(!ini || !fim){ ini = de; fim = ate; semData++; }
      return { Codigo: String(achar(l,'codigo','cod','codproduto','codigoproduto')).trim(),
        Title: String(achar(l,'descricao','item','produto','material','descricaoproduto')).trim(),
        DataInicio: ini, DataFim: fim, QtdSaida: numQtd(achar(l,'quantidade','qtd','qtde','quantidadesaida','saida','consumo','quantidadeconsumida')) };
    }).filter(l => l.Codigo && l.QtdSaida > 0 && l.DataInicio && l.DataFim && l.DataFim >= l.DataInicio);
    const brutas = linhasImport.length, grupos = new Map();
    for(const l of linhasImport){ const k = norm(l.Codigo) + '|' + l.DataInicio + '|' + l.DataFim, g = grupos.get(k);
      g ? (g.QtdSaida += l.QtdSaida, g.Title ||= l.Title) : grupos.set(k, { ...l }); }
    linhasImport = [...grupos.values()];
    const desconhecidos = new Set();
    for(const l of linhasImport){ const e = S.data.epis.find(e => norm(e.Codigo) === norm(l.Codigo));
      if(!e) desconhecidos.add(l.Codigo); if(!l.Title) l.Title = e?.Title || l.Codigo; }
    $('#prev').innerHTML = linhasImport.length
      ? `<div class="alert">${linhasImport.length} itens com saída${brutas > linhasImport.length ? ` (${brutas} linhas somadas por item)` : ''}${semData ? ` · ${semData} usando o período ${fmtData(de)} – ${fmtData(ate)}` : ''}.<br>
         Ex.: ${esc(linhasImport[0].Codigo)} · ${fmtData(linhasImport[0].DataInicio)} – ${fmtData(linhasImport[0].DataFim)} · ${linhasImport[0].QtdSaida}
         ${desconhecidos.size ? `<br><b>Atenção:</b> ${desconhecidos.size} código(s) não existem no Estoque (${esc([...desconhecidos].slice(0,5).join(', '))}${desconhecidos.size > 5 ? '…' : ''}). Serão importados, mas só entram no cálculo quando o EPI for cadastrado com esse código.` : ''}</div>`
      : `<div class="alert err">Não encontrei linhas válidas. Confira se há colunas "Código" e "Quantidade".</div>`;
    $('#btnImp').disabled = !linhasImport.length;
  } catch(e){ $('#prev').innerHTML = `<div class="alert err">Erro ao ler: ${esc(e.message)}</div>`; }
}
function paraData(v){
  if(v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 6e4).toISOString().slice(0,10);
  if(typeof v === 'number' && v > 20000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0,10);
  const s = String(v || '').trim(); let m;
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(m[2],2)}-${pad(m[3],2)}`;
  if((m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/))) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(m[2],2)}-${pad(m[1],2)}`;
  return '';
}
function paraMesAno(v){
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,7);
  if(typeof v === 'number' && v > 20000){ const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0,7); }
  const s = String(v||'').trim(); let m;
  if((m = s.match(/^(\d{4})[-/](\d{1,2})$/))) return `${m[1]}-${pad(m[2],2)}`;
  if((m = s.match(/^(\d{1,2})[-/](\d{4})$/))) return `${m[2]}-${pad(m[1],2)}`;
  const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  if((m = norm(s).match(/^([a-z]{3})[a-z]*[\s/-]*(\d{2,4})$/)) && meses.includes(m[1])) return `${m[2].length===2?'20'+m[2]:m[2]}-${pad(meses.indexOf(m[1])+1,2)}`;
  return '';
}

  /* --- recebimento (SHE) --- */
  receberTudo(){ document.querySelectorAll('[data-receb]').forEach(i => { if(!i.disabled) i.value = i.dataset.falta; }); },
  async receber(el){
    const p = S.data.pedidos.find(x => x.id === Number(el.dataset.id));
    const ent = [...document.querySelectorAll('[data-receb]')].map(i => ({ id:Number(i.dataset.receb), q:num(i.value), falta:num(i.dataset.falta) })).filter(x => x.q > 0);
    if(!ent.length) return toast('Informe a quantidade que chegou em pelo menos um item.', 'warn');
    const exc = ent.filter(x => x.q > x.falta);
    if(exc.length && !await confirmar('Algum item está chegando em quantidade MAIOR que a que falta. Registrar mesmo assim?', 'Registrar')) return;
    const data = $('#rcData').value || hoje();
    const ok = await salvar(el, async () => {
      await recarregar('epis','itens');                 // pega o estoque mais recente antes de somar
      for(const x of ent){
        const it = S.data.itens.find(i => i.id === x.id);
        await Store.update('itens', it.id, { QtdRecebida: num(it.QtdRecebida) + x.q, DataRecebimento: data, ...(it.DataPrimeiroRecebimento ? {} : { DataPrimeiroRecebimento: data }) });
        const e = epiPorId(it.EpiId);
        if(e) await Store.update('epis', e.id, { EstoqueAtual: num(e.EstoqueAtual) + x.q });
      }
      await recarregar('itens','epis');
      const completo = itensDo(p.id).every(i => num(i.QtdRecebida) >= num(i.QtdAprovada));
      const resumo = ent.map(x => `${x.q}× ${S.data.itens.find(i => i.id === x.id).Title}`).join(', ');
      await Store.update('pedidos', p.id, { Status: completo ? ST.RE : ST.PR, Historico: comHist(p, `Recebido: ${resumo}${completo ? ' · pedido completo' : ''}`) });
      await recarregar('pedidos');
    }, 'Recebimento registrado e estoque atualizado!');
    if(ok) render();
  },

  /* --- consumo --- */
  importar(){ linhasImport = []; modalImportar(); },
  async confirmarImport(el){

    // mesmo código + mesmo período = substitui (dá para reimportar sem duplicar)
    // (lançamentos ligados a um item específico, EpiId, não são mexidos)
    const existentes = new Map();
    for(const c of S.data.consumo.filter(c => !c.EpiId)){ const k = norm(c.Codigo) + '|' + c.DataInicio + '|' + c.DataFim; (existentes.get(k) || existentes.set(k, []).get(k)).push(c); }
    if(await salvar(el, async () => {
      for(const l of linhasImport){
        const [ex, ...sobra] = existentes.get(norm(l.Codigo) + '|' + l.DataInicio + '|' + l.DataFim) || [];
        ex ? await Store.update('consumo', ex.id, l) : await Store.add('consumo', l);
        for(const x of sobra) await Store.remove('consumo', x.id);   // linhas antigas do mesmo período viram uma só
        el.textContent = `Salvando ${++feitos}/${total}…`;

  async salvarConsumo(el){

    if(!e || !de || !ate || q <= 0) return toast('Preencha item, período e quantidade.', 'warn');

      const ex = S.data.consumo.find(c => Number(c.EpiId) === e.id && c.DataInicio === de && c.DataFim === ate);

document.addEventListener('click', ev => {
  const go = ev.target.closest('[data-go]'); if(go && !ev.target.closest('button,input,a')){ location.hash = go.dataset.go; return; }
  const el = ev.target.closest('[data-a]'); if(!el || !el.dataset.a || !A[el.dataset.a]) return;
  if(el.tagName === 'TR' && ev.target.closest('button,input')) return;
  ev.preventDefault(); A[el.dataset.a](el);
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape') closeModal();
  if(ev.key === 'Enter' && (ev.target.id === 'nvQtd')) A.addItem();
});

/* ============================ inicialização =========================== */
async function iniciar(){
  try {
    await Store.init();
    if(DEMO){
      await recarregar();
      let uid = null; try { uid = Number(sessionStorage.getItem('sigepi-demo-user')); } catch(e){}
      const u = S.data.usuarios.find(x => x.id === uid);
      if(u){ S.user = { nome:u.Title, email:u.Email, area:u.Area }; render(); } else telaLoginDemo();
      return;
    }
    if(!sessao) return telaLoginReal();
    const email = norm(sessao.user.email);
    let area = chk(await sb.rpc('minha_area'));
    if(!area){
      if(chk(await sb.rpc('existe_usuario'))) return telaSemAcesso(sessao.user.email);
      // primeiríssimo acesso: quem configurou vira Admin
      await Store.add('usuarios', { Title: sessao.user.user_metadata?.nome || email.split('@')[0], Email: email, Area:'Admin' });
      toast('Bem-vindo! Você é o Admin. Cadastre a equipe em Usuários.', 'ok', 8000);
    }
    await recarregar();
    const u = S.data.usuarios.find(x => norm(x.Email) === email);
    if(!u) return telaSemAcesso(sessao.user.email);
    S.user = { nome:u.Title, email:u.Email, area:u.Area };
    render();
  } catch(e){
    console.error(e);
    $('#app').innerHTML = `<div class="login"><div class="box"><h1>Não consegui conectar</h1><div class="alert err" style="margin-top:12px">${esc(e.message || e)}</div>
      <p class="muted small">Confira o supabaseUrl e o supabaseAnonKey no início do arquivo, e se o supabase.sql foi executado.</p>
      <button class="btn" onclick="location.reload()">Tentar de novo</button></div></div>`;
  }
}
